name: Mirror the notice catalogues

# MPA refuses cross-origin reads, so no request from the phone will ever read
# it. CORS is a rule browsers apply and this is not a browser: it fetches the
# catalogues here and commits them beside the app, where the phone can read
# them from its own origin.
#
# This does not spend the ship's data. It runs on GitHub, weekly, and the phone
# still downloads nothing until the button is tapped — it just has something
# to download when it is.

on:
  schedule:
    # Mondays, early UTC. Circulars are not hourly news.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-notices
  cancel-in-progress: false

env:
  BRANCH: claude/iphone-offline-storage-app-c14vtc

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install a browser
        # Not optional any more. MPA's listing endpoint is read with a plain
        # fetch, but its landing pages are served to a browser and to nothing
        # else, and that is where each circular's PDF link is.
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Read the catalogues
        run: node tools/mirror-notices.mjs

      - name: Find where Singapore's documents are
        # The one part that needs the browser. MPA serves its landing pages to
        # a browser and refuses everything else, and the PDF link is on the
        # page. The PDFs themselves are not protected, so this is only about
        # learning the addresses — and only for notices that do not have one
        # yet, so the first run does the lot and later runs do the new few.
        run: node tools/mpa-links.mjs

      - name: Fetch the documents
        # The measurement came back at 139 MB for MCA and 23 MB for Panama,
        # which fits comfortably. The budget is well above both, so nothing is
        # truncated; it is there to stop a runaway if a host starts serving
        # something unexpected.
        #
        # Singapore is fetched too now. It was left out on the belief that MPA
        # published its circulars as pages; it does not. The page is a landing
        # page and the circular is a PDF on it, which the step above goes and
        # finds.
        run: node tools/mirror-docs.mjs --budget=250 --only=MCA
      - name: Fetch Panama's documents
        run: node tools/mirror-docs.mjs --budget=250 --only=Panama
      - name: Fetch Singapore's documents
        run: node tools/mirror-docs.mjs --budget=250 --only=Singapore

      - name: Say what the site holds
        # Written from the catalogues, so it is right even on a run that
        # fetched nothing new.
        run: node tools/write-file-index.mjs

      - name: Commit anything that changed
        # A source that gave nothing leaves its file alone, so a quiet week is
        # simply no commit — and no commit means no deploy.
        run: |
          if [ -z "$(git status --porcelain library/data library/docs)" ]; then
            echo "No change in any catalogue."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/data library/docs
          git commit -m "Refresh the mirrored notice catalogues"

          # A push that lands on the branch while this is running gets the job
          # rejected, and an hour of downloading is thrown away with it. Rebase
          # onto whatever arrived and try again rather than losing the work.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected — rebasing onto what arrived (attempt $attempt)"
            git pull --rebase origin "$BRANCH" || exit 1
          done
          echo "Could not push after three attempts."
          exit 1
