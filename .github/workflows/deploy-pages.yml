name: Deploy AVA to GitHub Pages

# AVA is a static site — the repo root is the site. No build step, because the
# app deliberately has no dependencies and no bundler.

on:
  push:
    branches: [claude/iphone-offline-storage-app-c14vtc]

  # A push made with the Actions token deliberately does not start another
  # workflow — GitHub's own guard against runaway loops. So the mirror job's
  # weekly commit never triggered the deploy above, and its catalogues sat in
  # the repository without ever reaching the site. Listening for that job to
  # finish is what closes the loop.
  workflow_run:
    workflows: ["Mirror the notice catalogues"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A mirror run that failed has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true turns Pages on for the repo, so no manual setup is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        # Ship only what the app needs; tests and tooling stay out of the deploy.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js fonts icons vendor _site/
          # Library is a second installable app served from /library/.
          mkdir -p _site/library
          cp library/index.html library/manifest.webmanifest library/sw.js _site/library/
          cp -r library/css library/js library/fonts library/icons _site/library/
          # The mirrored catalogues, read by a scheduled job because the
          # administrations that publish them refuse the app directly.
          [ -d library/data ] && cp -r library/data _site/library/ || true
          echo "Deploying:" && find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
