name: Deploy AVA to GitHub Pages

# AVA is a static site — the repo root is the site. No build step, because the
# app deliberately has no dependencies and no bundler.

on:
  push:
    branches: [claude/iphone-offline-storage-app-c14vtc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true turns Pages on for the repo, so no manual setup is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        # Ship only what the app needs; tests and tooling stay out of the deploy.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js fonts icons _site/
          echo "Deploying:" && find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
