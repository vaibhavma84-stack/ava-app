<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Library</title>
<meta name="description" content="Ship manuals, publications, circulars and notices — stored and searched entirely on the device.">
<meta name="theme-color" content="#070809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ── One-time conversion of an older, encrypted library ───────────────── -->
<section id="lock" class="lock" hidden>
  <div class="lock-inner">
    <h1 class="lock-mark">LIBRARY</h1>
    <div class="lock-rule"></div>
    <p class="lock-sub">This library was created with a passcode.<br>Enter it once and it will not be asked for again.</p>

    <form id="migrateForm" class="lock-form" autocomplete="off">
      <input type="password" id="migrateCode" class="field" placeholder="Passcode"
             autocomplete="current-password" enterkeyhint="go">
      <button class="btn btn-primary" type="submit">Remove the passcode</button>
      <p class="lock-error" id="migrateError" role="alert" hidden></p>
      <p class="lock-note">
        Your documents are converted so they open straight away from now on. Ship documents are not
        secret, and your iPhone&rsquo;s own lock still guards them.
      </p>
    </form>
  </div>
</section>

<!-- ── App ────────────────────────────────────────────────────────────────── -->
<section id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden></button>
      <h1 class="brand" id="screenTitle">LIBRARY</h1>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </div>
    <div class="searchwrap">
      <input type="search" id="search" class="search" placeholder="Search titles and PDF contents"
             enterkeyhint="search" autocomplete="off">
    </div>
    <nav class="scope" id="scope" hidden aria-label="Filter"></nav>
  </header>

  <main class="body" id="body" tabindex="-1"></main>
  <button class="fab" id="fab" aria-label="Add entry" hidden>+</button>
</section>

<!-- ── Detail ─────────────────────────────────────────────────────────────── -->
<section id="detail" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-panel">
    <header class="sheet-bar"><strong id="detailTitle">Entry</strong></header>
    <div class="sheet-body" id="detailBody"></div>
    <footer class="sheet-actions">
      <button class="btn" id="detailClose">Close</button>
      <button class="btn btn-primary" id="detailEdit">Edit</button>
    </footer>
  </div>
</section>

<!-- ── Editor ─────────────────────────────────────────────────────────────── -->
<section id="editor" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-panel">
    <header class="sheet-bar"><strong id="editorTitle">New entry</strong></header>
    <div class="sheet-body" id="editorBody"></div>
    <footer class="sheet-actions">
      <button class="btn" id="editorCancel">Cancel</button>
      <button class="btn btn-primary" id="editorSave">Save</button>
    </footer>
  </div>
</section>

<!-- ── Document viewer ────────────────────────────────────────────────────── -->
<section id="viewer" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-panel viewer-panel">
    <header class="sheet-bar">
      <strong id="viewerTitle">Document</strong>
    </header>
    <div class="viewer-body" id="viewerBody"></div>
    <footer class="sheet-actions">
      <button class="btn" id="viewerClose">Close</button>
      <button class="btn btn-primary" id="viewerShare">Save to Files</button>
    </footer>
  </div>
</section>

<!-- ── Settings ───────────────────────────────────────────────────────────── -->
<section id="settings" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-panel">
    <header class="sheet-bar"><strong>Settings</strong></header>
    <div class="sheet-body" id="settingsBody"></div>
    <footer class="sheet-actions">
      <button class="btn btn-primary" id="settingsClose">Done</button>
    </footer>
  </div>
</section>

<div id="toast" class="toast" hidden></div>
<input type="file" id="filePicker" multiple hidden>
<input type="file" id="importPicker" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="backupPicker" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
